name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || github.event.repository.name }}
  CARGO_TERM_COLOR: always
  # Pin Trunk so frontend builds do not drift with :latest.
  TRUNK_VERSION: "0.21.13"

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19beta2-alpine
        env:
          POSTGRES_DB: denpie
          POSTGRES_USER: denpie
          POSTGRES_PASSWORD: denpie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denpie -d denpie"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://denpie:denpie@127.0.0.1:5432/denpie
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-all-crates: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler postgresql-client

      - name: Enforce API v1 contract
        env:
          API_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$API_CONTRACT_BASE" ] && \
             [ "$API_CONTRACT_BASE" != "0000000000000000000000000000000000000000" ]; then
            sh scripts/check-api-contract.sh --against-git "$API_CONTRACT_BASE"
          else
            sh scripts/check-api-contract.sh
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: DENPIE_SKIP_FRONTEND_BUILD=1 cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: DENPIE_SKIP_FRONTEND_BUILD=1 cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-all-crates: true

      - name: Install Trunk ${{ env.TRUNK_VERSION }}
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C ~/.cargo/bin
          trunk --version

      - name: Build frontend
        run: cd frontend && env -u NO_COLOR trunk build --release

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: api-docs
          cache-all-crates: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/api/typescript/package-lock.json

      - name: Install protobuf tooling
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler python3-protobuf

      - name: Install TypeScript example dependencies
        run: npm --prefix examples/api/typescript ci --ignore-scripts

      - name: Check API documentation and examples
        run: sh scripts/check-api-docs.sh

      - name: Package API v1 schema
        run: sh scripts/package-api-schema.sh

      - name: Upload API v1 schema
        uses: actions/upload-artifact@v4
        with:
          name: denpie-api-v1-schema
          path: target/api-schema/v1/

  # Skip entirely when Docker Hub credentials are unavailable — no build or push
  # without an ability to publish. PR validation of the image is also skipped in
  # that case to avoid burning CI minutes on a non-actionable artifact.
  docker:
    runs-on: ubuntu-latest
    needs: [rust, frontend, api-docs]
    if: >-
      github.event_name == 'push'
      && secrets.DOCKERHUB_USERNAME != ''
      && secrets.DOCKERHUB_TOKEN != ''
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
