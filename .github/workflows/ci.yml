name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: denpie
          POSTGRES_USER: denpie
          POSTGRES_PASSWORD: denpie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denpie -d denpie"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://denpie:denpie@127.0.0.1:5432/denpie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-all-crates: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler postgresql-client

      - name: Enforce API v1 contract
        env:
          API_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$API_CONTRACT_BASE" ] && \
             [ "$API_CONTRACT_BASE" != "0000000000000000000000000000000000000000" ]; then
            sh scripts/check-api-contract.sh --against-git "$API_CONTRACT_BASE"
          else
            sh scripts/check-api-contract.sh
          fi

      - name: Test SQLite to PostgreSQL migration
        env:
          DENPIE_PSQL_DOCKER_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 -m unittest scripts.tests.test_sqlite_postgres_migration

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: DENPIE_SKIP_FRONTEND_BUILD=1 cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: DENPIE_SKIP_FRONTEND_BUILD=1 cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend-astro

      - name: Check topic icons
        run: bun run check:topic-icons
        working-directory: frontend-astro

      - name: Check i18n catalog usage
        run: bun run check:i18n
        working-directory: frontend-astro

      - name: Run frontend tests
        run: bun test
        working-directory: frontend-astro

      - name: Build frontend
        run: bun run build
        working-directory: frontend-astro

      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend-astro/dist/
          retention-days: 1

  api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: api-docs
          cache-all-crates: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/api/typescript/package-lock.json

      - name: Install protobuf tooling
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler python3-protobuf

      - name: Install TypeScript example dependencies
        run: npm --prefix examples/api/typescript ci --ignore-scripts

      - name: Check API documentation and examples
        run: sh scripts/check-api-docs.sh

      - name: Package API v1 schema
        run: sh scripts/package-api-schema.sh

      - name: Upload API v1 schema
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denpie-api-v1-schema
          path: target/api-schema/v1/

  # GitHub does not allow the secrets context in a job-level condition. This job
  # runs only for pushes; the login step reports a missing deployment secret.
  docker:
    runs-on: ubuntu-latest
    needs: [rust, frontend, api-docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DENPIE_IMAGE_REPOSITORY: slopsphere/denpie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend-astro/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DENPIE_IMAGE_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write immutable promotion artifact
        run: |
          printf 'DENPIE_IMAGE=%s@%s\n' "$DENPIE_IMAGE_REPOSITORY" '${{ steps.build.outputs.digest }}' > denpie-image.env
          printf '%s\n' '${{ steps.build.outputs.digest }}' | sed 's/^sha256://' > denpie-image.env.release-id

      - name: Upload immutable promotion artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denpie-image
          path: denpie-image.env
          retention-days: 30

      - name: Publish the deployable master release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: continuous-${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "${{ github.sha }}" \
              --title "Continuous master ${{ github.sha }}" \
              --notes "Verified master image for automatic BRR deployment." \
              --prerelease \
              denpie-image.env denpie-image.env.release-id
          fi
