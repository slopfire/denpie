syntax = "proto3";

package denpie;

message TipsQuery {
    uint64 count = 1; // repeatable: target deck load size (1 active, remainder pending; max 10)
    string topics = 2; // comma separated
    string tipcard_type = 4; // optional: "repeatable_tip", "casual_tip", or "manual_tip"
    repeated int64 exclude_card_ids = 5;
    string manual_content = 6;
    string manual_compressed_content = 7;
    reserved 3; // was topic_class
}

message CustomTipcardRequest {
    string topic = 1;
    string full_content = 2;
    string compressed_content = 3;
    string title = 4;
}

message TipCardResponse {
    int64 id = 1;
    string topic = 2;
    string full_content = 3;
    string compressed_content = 4;
    string tipcard_type = 6;
    bool pinned = 7;
    reserved 5; // was topic_class
}

message TipsResponse {
    repeated TipCardResponse tips = 1;
}

message ReviewPayload {
    int64 card_id = 1;
    uint32 grade = 2;
    // Repeatable cards: again, learned, skip_known, skip_not_interested,
    // or skip_too_difficult. Legacy repeat/memorize/dismiss remain accepted.
    string action = 3;
}

message GetTopicsResponse {
    repeated string topics = 1;
}

message Empty {}

message ApiRequest {
    // API key for all operations except bootstrap_api_key. The key owner
    // determines which user's topics, cards, settings, and keys are visible.
    string auth = 1;

    oneof op {
        BootstrapApiKeyRequest bootstrap_api_key = 2;
        TipsQuery tips = 3;
        ReviewPayload review = 4;
        Empty get_topics = 5;
        Empty get_settings = 7;
        UpdateSettingsRequest update_settings = 8;
        CreateApiKeyRequest create_api_key = 9;
        Empty list_api_keys = 10;
        DeleteByIdRequest delete_api_key = 11;
        Empty list_admin_topics = 12;
        Empty list_tipcards = 13;
        DeleteByIdRequest delete_tipcard = 14;
        Empty get_summary = 15;
        Empty list_app_topics = 16;
        UpdateTopicRequest update_topic = 17;
        DeleteByIdRequest delete_topic = 18;
        PinTipcardRequest pin_tipcard = 19;
        CustomTipcardRequest submit_custom_tipcard = 20;
        ForceDailyRefreshRequest force_daily_refresh = 21;
        AddDocumentRequest add_document = 22;
        Empty list_documents = 23;
        DeleteByIdRequest delete_document = 24;
        AddPoolImageRequest add_pool_image = 25;
        Empty list_pool_images = 26;
        DeleteByIdRequest delete_pool_image = 27;
        AttachDocumentTopicRequest attach_document_topic = 28;
        AttachDocumentTopicRequest detach_document_topic = 29;
        Empty get_api_info = 30;
        ListFlowCardsRequest list_flow_cards = 31;
        GetByIdRequest get_tipcard = 32;
        GetByIdRequest get_document = 33;
        ContinueDailyReviewRequest continue_daily_review = 34;
        ExploreLinkRequest explore_link = 35;
        Empty test_vision_model = 36;
        AddDocumentRequest create_document = 37;
        UploadDocumentRequest upload_document = 38;
        AddPoolImageRequest create_pool_image = 39;
        TipsRequestV1 tips_v1 = 40;
        ReviewRequestV1 review_v1 = 41;
        CreateApiKeyV1Request create_api_key_v1 = 42;
        ReviewAndAdvanceRequest review_and_advance = 43;
        AppendTipcardImagesRequest append_tipcard_images = 44;
        ReplaceTipcardImagesRequest replace_tipcard_images = 45;
    }
}

message ApiResponse {
    oneof result {
        ApiKeyCreated api_key_created = 1;
        TipsResponse tips = 2;
        Empty ok = 3;
        GetTopicsResponse topics = 4;
        Settings settings = 6;
        ApiKeys api_keys = 7;
        AdminTopics admin_topics = 8;
        Tipcards tipcards = 9;
        AppSummary summary = 10;
        AppTopics app_topics = 11;
        ForceDailyRefreshResponse force_daily_refresh = 12;
        Documents documents = 13;
        PoolImages pool_images = 14;
        ApiInfo api_info = 15;
        FlowCardPage flow_card_page = 16;
        TipcardDetail tipcard_detail = 17;
        DocumentDetail document_detail = 18;
        ContinueDailyReviewResponse continue_daily_review = 19;
        ExploredLinks explored_links = 20;
        VisionModelTest vision_model_test = 21;
        DocumentDetail document_created = 22;
        PoolImageCreated pool_image_created = 23;
        ReviewAndAdvanceResponse review_and_advance = 24;
    }
}

message BootstrapApiKeyRequest {
    // Setup token printed by the server. This only works after a setup admin
    // user exists; the created key belongs to the first admin user.
    string admin_token = 1;
    string client_name = 2;
}

message CreateApiKeyRequest {
    string client_name = 1;
}

message ApiKeyCreated {
    string api_key = 1;
}

message DeleteByIdRequest {
    int64 id = 1;
}

message Settings {
    string model = 1;
    string compress_model = 2;
    string template = 3;
    string api_key = 4;
    string base_url = 5;
    string compress_base_url = 6;
    string reasoning_effort = 7;
    string compress_reasoning_effort = 8;
    string color_scheme = 9;
    bool autoupdate_enabled = 10;
    string autoupdate_repo = 11;
    string autoupdate_branch = 12;
    uint64 autoupdate_check_interval_secs = 13;
    string autoupdate_command = 14;
    string autoupdate_last_seen_sha = 15;
    string daily_time_zone = 16;
    string daily_update_time = 17;
    uint64 max_active_cards = 18;
    string compression_level = 19;
    string grounding_strategy = 20;
    string image_strategy = 21;
    string search_api_key = 22;
    string search_base_url = 23;
    string image_sources = 24; // unused leftover; stored as JSON array, default []
    string grounding_model = 25;
    string grounding_reasoning_effort = 26;
    string search_provider = 27;
    string scrape_provider = 28;
    string vision_model = 29;
    string transparency = 30;
    string blur_intensity = 31;
}

message UpdateSettingsRequest {
    optional string model = 1;
    optional string compress_model = 2;
    optional string template = 3;
    optional string api_key = 4;
    optional string base_url = 5;
    optional string compress_base_url = 6;
    optional string reasoning_effort = 7;
    optional string compress_reasoning_effort = 8;
    optional string color_scheme = 9;
    optional bool autoupdate_enabled = 10;
    optional string autoupdate_repo = 11;
    optional string autoupdate_branch = 12;
    optional uint64 autoupdate_check_interval_secs = 13;
    optional string autoupdate_command = 14;
    optional string daily_time_zone = 15;
    optional string daily_update_time = 16;
    optional uint64 max_active_cards = 17;
    optional string compression_level = 18;
    optional string grounding_strategy = 19;
    optional string image_strategy = 20;
    optional string search_api_key = 21;
    optional string search_base_url = 22;
    optional string image_sources = 23; // unused leftover; ignored by strategies
    optional string grounding_model = 24;
    optional string grounding_reasoning_effort = 25;
    optional string search_provider = 26;
    optional string scrape_provider = 27;
    optional string vision_model = 28;
    optional string transparency = 29;
    optional string blur_intensity = 30;
}

message ApiKeyInfo {
    int64 id = 1;
    string client_name = 2;
    string created_at = 3;
    repeated string scopes = 4;
    string expires_at = 5;
    string last_used_at = 6;
}

message ApiKeys {
    repeated ApiKeyInfo keys = 1;
}

message AdminTopic {
    int64 id = 1;
    string name = 2;
    string prompt_template = 3;
    uint32 daily_card_count = 4;
    string daily_time_zone = 5;
    string daily_update_time = 6;
    string compression_level = 7;
    string grounding_strategy = 8;
    string image_strategy = 9;
    reserved 10;
}

message AdminTopics {
    repeated AdminTopic topics = 1;
}

message TipcardInfo {
    int64 id = 1;
    string topic_name = 2;
    string full_content = 3;
    string compressed_content = 4;
    string created_at = 5;
    string tipcard_type = 6;
    string status = 8;
    string next_review_at = 9;
    uint32 repeat_count = 10;
    bool pinned = 11;
    reserved 7; // was topic_class
    // Dashboard-parity display fields for inventory/archive UIs.
    string title = 12;
    string topic_icon = 13;
    string topic_color = 14;
    // Stored attachments for active, completed, and pending inventory cards.
    repeated TipcardImageInfo images = 15;
}

message Tipcards {
    repeated TipcardInfo cards = 1;
}

message AppSummary {
    int64 topics = 1;
    int64 total_cards = 2;
    int64 due_cards = 3;
    int64 active_cards = 4;
}

message AppTopicInfo {
    int64 id = 1;
    string name = 2;
    string tipcard_type = 4;
    string prompt_template = 5;
    int64 total_cards = 6;
    int64 due_cards = 7;
    int64 completed_cards = 8;
    uint32 daily_card_count = 9;
    string daily_time_zone = 10;
    string daily_update_time = 11;
    string compression_level = 12;
    string grounding_strategy = 13;
    string image_strategy = 14;
    reserved 3; // was class_name
    reserved 15;
    // Dashboard-parity visual + queue fields for the browser grounding UI.
    string icon_id = 16;
    string topic_color = 17;
    int64 pending_cards = 18;
}

message AppTopics {
    repeated AppTopicInfo topics = 1;
}

message UpdateTopicRequest {
    int64 id = 1;
    optional string prompt_template = 2;
    optional uint32 daily_card_count = 3;
    optional string daily_time_zone = 4;
    optional string daily_update_time = 5;
    optional string compression_level = 6;
    optional string grounding_strategy = 7;
    optional string image_strategy = 8;
    reserved 9;
}

message PinTipcardRequest {
    int64 id = 1;
    bool pinned = 2;
}

message ForceDailyRefreshRequest {
    string topics = 1; // comma separated
    string tipcard_type = 3; // optional: "repeatable_tip" or "casual_tip"
    reserved 2; // was topic_class
}

enum ForceDailyRefreshOutcome {
    FORCE_DAILY_REFRESH_OUTCOME_UNSPECIFIED = 0;
    FORCE_DAILY_REFRESH_OUTCOME_CARD_AVAILABLE = 1;
    FORCE_DAILY_REFRESH_OUTCOME_QUEUE_REFILLED = 2;
    FORCE_DAILY_REFRESH_OUTCOME_NO_CHANGE = 3;
    FORCE_DAILY_REFRESH_OUTCOME_ACTIVE_LIMIT_REACHED = 4;
}

message ForceDailyRefreshResponse {
    uint64 refreshed_cards = 1; // legacy count of topics changed
    ForceDailyRefreshOutcome outcome = 2;
    uint64 available_cards = 3;
    uint64 generated_cards = 4;
}

message AddDocumentRequest {
    string topic_id_opt = 1; // legacy single-topic assignment; empty = unassigned
    string source_type = 2;  // "document" or "link"
    string title = 3;
    string url = 4;
    string content = 5;
    repeated int64 topic_ids = 6;
}

message DocumentInfo {
    int64 id = 1;
    int64 topic_id = 2; // legacy single-topic assignment
    string source_type = 3;
    string title = 4;
    string url = 5;
    string created_at = 6;
    repeated int64 topic_ids = 7;
}

message Documents {
    repeated DocumentInfo docs = 1;
}

message AddPoolImageRequest {
    string image_data = 1; // data-URL
    string name = 2;
    string description = 3;
}

message PoolImageInfo {
    int64 id = 1;
    string name = 2;
    string description = 3;
    string created_at = 4;
    repeated string tags = 5;
}

message PoolImages {
    repeated PoolImageInfo images = 1;
}

message AttachDocumentTopicRequest {
    int64 document_id = 1;
    int64 topic_id = 2;
}

// Versioned transport envelope. POST /api remains the compatibility endpoint;
// POST /api/v1 wraps the same additive operation set with request correlation
// and a protobuf error body on every handled failure.
message ApiV1Request {
    string request_id = 1;
    ApiRequest call = 2;
    // Required for mutating operations. The Idempotency-Key HTTP header is an
    // equivalent transport-level alternative; if both are present they must match.
    string idempotency_key = 3;
}

message ApiV1Response {
    string request_id = 1;
    oneof outcome {
        ApiResponse success = 2;
        ApiError error = 3;
    }
}

enum ApiErrorCode {
    API_ERROR_CODE_UNSPECIFIED = 0;
    API_ERROR_CODE_INVALID_ARGUMENT = 1;
    API_ERROR_CODE_UNAUTHENTICATED = 2;
    API_ERROR_CODE_PERMISSION_DENIED = 3;
    API_ERROR_CODE_NOT_FOUND = 4;
    API_ERROR_CODE_CONFLICT = 5;
    API_ERROR_CODE_RATE_LIMITED = 6;
    API_ERROR_CODE_UNSUPPORTED_MEDIA_TYPE = 7;
    API_ERROR_CODE_INTERNAL = 8;
}

message ApiError {
    ApiErrorCode code = 1;
    string message = 2;
    bool retryable = 3;
}

message ApiInfo {
    string api_version = 1;
    string server_version = 2;
    string build_sha = 3;
    repeated string capabilities = 4;
}

message GetByIdRequest {
    int64 id = 1;
}

message ListFlowCardsRequest {
    uint32 page_size = 1; // default 48, clamped to 1..100
    string page_token = 2;
}

message TipcardImageInfo {
    int64 id = 1;
    int64 position = 2;
    string mime_type = 3;
    int64 byte_size = 4;
    string download_path = 5;
}

message FlowCardInfo {
    int64 id = 1;
    string topic_name = 2;
    string topic_icon = 3;
    string topic_color = 4;
    string title = 5;
    string full_content = 6;
    string compressed_content = 7;
    string created_at = 8;
    string tipcard_type = 9;
    string status = 10;
    string next_review_at = 11;
    uint32 repeat_count = 12;
    bool pinned = 13;
    int64 pending_count = 14;
    repeated TipcardImageInfo images = 15;
    repeated CardSource sources = 16;
}

// A grounding source (user document or link) assigned to the card's topic.
message CardSource {
    int64 document_id = 1;
    string source_type = 2;  // "document" or "link"
    string title = 3;
    optional string url = 4;
}

message FlowCardPage {
    repeated FlowCardInfo cards = 1;
    string next_page_token = 2;
    bool has_more = 3;
}

message TipcardDetail {
    FlowCardInfo card = 1;
}

message AppendTipcardImagesRequest {
    int64 card_id = 1;
    repeated string image_data = 2;
    repeated int64 pool_image_ids = 3;
    repeated string urls = 4;
}

message ReplaceTipcardImagesRequest {
    int64 card_id = 1;
    repeated string image_data = 2;
}

message DocumentDetail {
    int64 id = 1;
    repeated int64 topic_ids = 2;
    string source_type = 3;
    string title = 4;
    string url = 5;
    string content = 6;
    string created_at = 7;
}

message ContinueDailyReviewRequest {
    repeated string topics = 1;
    string tipcard_type = 2;
}

message ContinueDailyReviewResponse {
    uint64 available_cards = 1;
    // Exact active card prepared for the requested repeatable-topic slot.
    optional int64 active_card_id = 2;
    // Eligible unseen cards remaining behind the active topic card.
    uint32 pending_count = 3;
}

message ExploreLinkRequest {
    string url = 1;
}

message ExploredLink {
    string title = 1;
    string url = 2;
}

message ExploredLinks {
    repeated ExploredLink links = 1;
}

message VisionModelTest {
    bool ok = 1;
    string model = 2;
    string message = 3;
}

enum TipcardTypeValue {
    TIPCARD_TYPE_VALUE_UNSPECIFIED = 0;
    TIPCARD_TYPE_VALUE_REPEATABLE = 1;
    TIPCARD_TYPE_VALUE_CASUAL = 2;
    TIPCARD_TYPE_VALUE_MANUAL = 3;
    TIPCARD_TYPE_VALUE_CUSTOM = 4;
}

enum ReviewActionValue {
    // Unspecified means grade-only: no named action string (empty action).
    REVIEW_ACTION_VALUE_UNSPECIFIED = 0;
    REVIEW_ACTION_VALUE_AGAIN = 1;
    REVIEW_ACTION_VALUE_LEARNED = 2;
    REVIEW_ACTION_VALUE_SKIP_KNOWN = 3;
    REVIEW_ACTION_VALUE_SKIP_NOT_INTERESTED = 4;
    REVIEW_ACTION_VALUE_SKIP_TOO_DIFFICULT = 5;
    // Casual/manual Acknowledge (and "acknowledged" alias on the string API).
    REVIEW_ACTION_VALUE_ACKNOWLEDGE = 6;
}

message UploadDocumentRequest {
    repeated int64 topic_ids = 1;
    string filename = 2;
    string mime_type = 3;
    string title = 4;
    bytes data = 5;
}

message PoolImageCreated {
    int64 id = 1;
    string name = 2;
    string description = 3;
    repeated string tags = 4;
    bool annotated = 5;
    string fallback_reason = 6;
    string model = 7;
    string download_path = 8;
}

message TipsRequestV1 {
    uint32 count = 1;
    repeated string topics = 2;
    TipcardTypeValue tipcard_type = 3;
    repeated int64 exclude_card_ids = 4;
    string manual_content = 5;
    string manual_compressed_content = 6;
    repeated string manual_image_data = 7;
}

message ReviewRequestV1 {
    int64 card_id = 1;
    uint32 grade = 2;
    ReviewActionValue action = 3;
}

message ReviewAndAdvanceRequest {
    int64 card_id = 1;
    uint32 grade = 2;
    ReviewActionValue action = 3;
}

message ReviewAndAdvanceResponse {
    int64 reviewed_card_id = 1;
    FlowCardInfo next_card = 2;
    bool daily_complete = 3;
    uint32 pending_count = 4;
    bool refill_scheduled = 5;
}

message CreateApiKeyV1Request {
    string client_name = 1;
    repeated string scopes = 2;
    string expires_at = 3; // optional RFC 3339 timestamp
}
